<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상류사회 오버레이 (타이틀 제거버전)</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; user-select: none; }

        body {
            width: 1080px; height: 1920px;
            background-color: #05020a;
            background-image: radial-gradient(circle at 50% 20%, rgba(70, 20, 100, 0.35) 0%, transparent 60%), radial-gradient(circle at 50% 80%, rgba(20, 60, 100, 0.2) 0%, transparent 60%);
            color: white; overflow: hidden; position: relative;
        }

        .ambient-light { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1200px; height: 1200px; background: radial-gradient(circle, rgba(255,223,0,0.05) 0%, transparent 70%); z-index: 0; }

        /* 벽과 영토 게이지를 묶는 컨테이너 (타이틀 제거로 margin-top 증가) */
        .board-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1040px;
            margin: 400px auto 0;
            gap: 15px;
            position: relative;
            z-index: 10;
        }
        /* 좌우 벽(Wall) 디자인 */
        .wall {
            width: 55px;
            height: 340px;
            background: #111;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px);
            border: 2px solid #333;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 15px #000, 0 10px 20px rgba(0,0,0,0.8);
        }

        .wall-left {
            border-right: 3px solid #ff0066;
            box-shadow: inset 0 0 15px #000, 5px 0 20px rgba(255, 0, 102, 0.4);
        }
        .wall-right {
            border-left: 3px solid #00ff88;
            box-shadow: inset 0 0 15px #000, -5px 0 20px rgba(0, 255, 136, 0.4);
        }

        .wall-text {
            writing-mode: vertical-rl;
            text-orientation: upright;
            color: #555;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 8px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        /* 날렵해진 메인 영토 게이지 */
        .game-board-wrapper {
            flex: 1;
            height: 280px;
            background: rgba(20, 10, 30, 0.4);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,255,255,0.05);
        }

        .game-board { display: flex; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background: #000; }

        .territory { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); border-right: 2px solid rgba(0, 0, 0, 0.8); }
        .territory:last-child { border-right: none; }
        .territory-bg { position: absolute; inset: 0; opacity: 0.25; background-image: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, transparent 100%); }

        .member-info { position: relative; z-index: 2; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .t-name { font-size: 42px; font-weight: 800; letter-spacing: 2px; color: #fff; }
        .t-size { font-family: 'Cinzel', serif; font-size: 38px; font-weight: 700; color: #fff; background: rgba(0, 0, 0, 0.6); padding: 8px 25px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); display: flex; align-items: baseline; gap: 6px; }
        .t-unit { font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 600; color: #aaa; }

        /* 무인도 영역 */
        .island-area { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); width: 920px; min-height: 220px; background: linear-gradient(135deg, rgba(15, 20, 25, 0.8), rgba(5, 10, 15, 0.9)); border: 2px solid #00ff88; border-radius: 25px; padding: 30px; box-shadow: 0 0 40px rgba(0, 255, 136, 0.15); z-index: 10; }
        .island-title { font-size: 30px; font-weight: 800; color: #00ff88; text-align: center; margin-bottom: 25px; letter-spacing: 8px; }
        .island-members { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .island-item { padding: 15px 30px; background: rgba(0,0,0,0.8); border-radius: 15px; font-size: 30px; font-weight: 800; color: #fff; border: 2px solid; filter: grayscale(0.3) brightness(0.7); transition: all 0.5s ease; }
    </style>
</head>
<body>
    <div class="ambient-light"></div>

    <!-- 장벽과 영토 게이지를 포함하는 컨테이너 -->
    <div class="board-container">
        <div class="wall wall-left"><div class="wall-text">WALL</div></div>

        <div class="game-board-wrapper">
            <div class="game-board" id="gameBoard"></div>
        </div>

        <div class="wall wall-right"><div class="wall-text">WALL</div></div>
    </div>
    <div class="island-area">
        <div class="island-title">ISLAND (방석 자리)</div>
        <div class="island-members" id="islandMembers"></div>
    </div>
    <script>
        const board = document.getElementById('gameBoard');
        const island = document.getElementById('islandMembers');
        let lastDataString = "";
        const userId = (() => {
            const q = new URLSearchParams(location.search);
            const raw = (q.get('u') || q.get('user') || 'finalent').trim();
            return /^[a-zA-Z0-9_-]{1,64}$/.test(raw) ? raw : 'finalent';
        })();

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function fetchGameState() {
            fetch(`/api/shangliu?u=${encodeURIComponent(userId)}`, { cache: 'no-store' })
                .then((r) => r.json())
                .then((j) => {
                    if (!j || !j.ok || !j.state) return;
                    const dataStr = JSON.stringify(j.state);
                    if (lastDataString === dataStr) return;
                    lastDataString = dataStr;
                    try { localStorage.setItem('shangliu_state', dataStr); } catch (_e) {}
                    render(j.state);
                })
                .catch(() => {
                    const dataStr = localStorage.getItem('shangliu_state');
                    if (!dataStr || lastDataString === dataStr) return;
                    lastDataString = dataStr;
                    render(JSON.parse(dataStr));
                });
        }

        function render(data) {
            const { activeOrder, members } = data;
            const order = Array.isArray(activeOrder) ? activeOrder : Object.keys(members || {});
            const roster = members && typeof members === "object" ? members : {};

            let totalCm = 0;
            order.forEach((id) => { if (roster[id]) totalCm += Number(roster[id].cm) || 0; });

            board.innerHTML = "";
            island.innerHTML = "";

            order.forEach((id) => {
                const m = roster[id];
                if (!m) return;
                const cm = Math.max(0, Number(m.cm) || 0);
                const color = m.color || "#888888";
                const name = m.name || id;

                if (cm <= 0) {
                    const item = document.createElement("div");
                    item.className = "island-item";
                    item.style.borderColor = color;
                    item.textContent = name;
                    island.appendChild(item);
                    return;
                }

                const visualPercentage = totalCm > 0 ? (cm / totalCm) * 100 : 0;
                const div = document.createElement("div");
                div.className = "territory";
                div.style.width = `${visualPercentage}%`;
                div.style.background = `linear-gradient(180deg, ${color} 0%, ${color}99 100%)`;
                div.style.boxShadow = `inset 0 0 60px ${color}50`;
                div.innerHTML = `
                    <div class="territory-bg" style="background-color:${escapeHtml(color)}"></div>
                    <div class="member-info">
                        <div class="t-name">${escapeHtml(name)}</div>
                        <div class="t-size">${escapeHtml(String(cm))}<span class="t-unit">cm</span></div>
                    </div>
                `;
                board.appendChild(div);
            });

            Object.keys(roster).forEach((id) => {
                if (order.includes(id)) return;
                const m = roster[id];
                if (!m) return;
                const item = document.createElement("div");
                item.className = "island-item";
                item.style.borderColor = m.color || "#00ff88";
                item.textContent = m.name || id;
                island.appendChild(item);
            });
        }

        window.addEventListener("storage", fetchGameState);
        setInterval(fetchGameState, 400);
        fetchGameState();
    </script>
</body>
</html>
