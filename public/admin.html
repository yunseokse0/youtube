<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상류사회 백오피스 컨트롤러</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * { box-sizing: border-box; font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; }
        body { background: #0a0510; color: #fff; padding: 28px; }
        .container { max-width: 1280px; margin: 0 auto; }

        .header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #333; padding-bottom: 20px; margin-bottom: 24px; }
        .header h1 { font-size: 32px; font-weight: 900; color: #ffdf00; letter-spacing: 2px; }
        .header p { color: #888; font-size: 14px; margin-top: 5px; }

        .panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 24px; margin-bottom: 18px; }
        .panel h3 { margin-bottom: 16px; color: #ccc; }

        input, select, button { padding: 12px; border-radius: 8px; border: 1px solid #444; background: #000; color: #fff; font-size: 15px; }
        button { cursor: pointer; font-weight: bold; transition: all 0.2s; }
        button:hover { background: #333; }

        .btn-start { background: #00ff88; color: #000; border: none; padding: 12px 30px; font-size: 16px; margin-left: 10px; }
        .btn-start:hover { background: #00cc6a; }
        .btn-reset { background: #ff3366; color: #fff; border: none; }
        .btn-grant { background: #ffdf00; color: #111; border: none; }
        .btn-grant:hover { background: #e6c800; color: #111; }
        .btn-set { background: rgba(0,243,255,0.18); border: 1px solid #00f3ff; color: #00f3ff; }

        .setup-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }

        .roster-table { width: 100%; border-collapse: collapse; }
        .roster-table th { text-align: left; color: #888; font-size: 12px; font-weight: 700; padding: 6px 8px; }
        .roster-table td { padding: 6px 8px; }
        .roster-table input[type="number"] { width: 120px; text-align: center; }
        .roster-table input[type="text"] { width: 100%; font-weight: 800; }
        .roster-table input[type="color"] { width: 46px; height: 42px; padding: 3px; cursor: pointer; background: #111; }

        .preview-wrap {
            background: #1e1628;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            overflow: hidden;
            height: 240px;
            position: relative;
        }
        .preview-wrap iframe {
            width: 1080px;
            height: 320px;
            border: 0;
            transform: scale(0.78);
            transform-origin: top left;
            pointer-events: none;
        }
        .preview-caption { font-size: 13px; color: #888; margin-top: 8px; }

        .seat-bar {
            display: flex;
            align-items: stretch;
            gap: 8px;
            margin-bottom: 16px;
        }
        .seat-wall {
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            writing-mode: vertical-rl;
            text-orientation: upright;
            letter-spacing: 4px;
            font-size: 11px;
            font-weight: 900;
            color: rgba(255,255,255,0.35);
            background: #111;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .seat-chip {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 2px solid;
            border-radius: 10px;
            background: #000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .seat-chip .seat-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .seat-chip .seat-name { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .seat-chip .seat-cm { font-size: 12px; color: #aaa; }
        .seat-chip .seat-actions { display: flex; gap: 6px; }
        .seat-chip .seat-actions button { flex: 1; padding: 8px; font-size: 12px; }
        .seat-chip select { width: 100%; padding: 8px; font-size: 13px; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        .card {
            background: rgba(0,0,0,0.55);
            border: 2px solid;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        .card-cm { font-size: 18px; font-weight: 900; color: #fff; line-height: 1.1; }
        .card-cm span { font-size: 11px; color: #aaa; font-weight: 700; }
        .seat-badge {
            font-size: 10px; font-weight: 800; color: #ffdf00;
            background: rgba(255,223,0,0.12); border: 1px solid rgba(255,223,0,0.35);
            border-radius: 999px; padding: 2px 7px; white-space: nowrap;
        }
        .card input, .card select, .card button { padding: 7px 8px; font-size: 13px; border-radius: 6px; }
        .action-group { display: flex; gap: 6px; }
        .action-group input { flex: 1; text-align: center; min-width: 0; }
        .action-group button { flex: 0 0 auto; white-space: nowrap; }
        .btn-expand { background: rgba(255,255,255,0.1); flex: 1; border: 1px solid rgba(255,255,255,0.2); }
        .btn-expand:hover { background: #fff; color: #000; }
        .rule-text { font-size: 11px; color: #777; text-align: left; padding: 0; background: none; }
        .identity-row { display: flex; gap: 6px; align-items: center; }
        .identity-row input[type="color"] {
            width: 32px; height: 32px; padding: 2px; cursor: pointer;
            background: #111; border: 1px solid #444;
        }
        .identity-row input[type="text"] { flex: 1; font-weight: 800; font-size: 14px; min-width: 0; }
        .btn-swap { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); }
        .btn-swap:disabled { opacity: 0.35; cursor: not-allowed; }

        .card.offboard { border-color: #555 !important; }
        .btn-revive { background: transparent; border: 1px dashed #666; color: #ccc; flex: 1; }
        .btn-revive:hover { border-color: #fff; color: #fff; }

        .fx-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }
        .fx-toolbar .btn-expand { white-space: nowrap; }
        .fx-desc-line { color: #888; font-size: 13px; line-height: 1.45; }
        .alloc-hint { font-size: 13px; color: #888; }
        .alloc-hint.ok { color: #00ff88; }
        .alloc-hint.warn { color: #ff6688; }
        .territory-bar {
            display: flex; height: 18px; border-radius: 9px; overflow: hidden;
            background: #111; border: 1px solid #333; margin: 10px 0 4px;
        }
        .territory-bar span { display: block; height: 100%; min-width: 0; }
        .btn-add { background: #00ff88; color: #000; border: none; }
        .btn-del { background: transparent; border: 1px solid #553; color: #faa; }
        .grant-log {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: #07050a;
        }
        .grant-log-row {
            display: grid;
            grid-template-columns: 72px 52px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 7px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 13px;
        }
        .grant-log-row:last-child { border-bottom: none; }
        .grant-log-time { color: #888; font-variant-numeric: tabular-nums; }
        .grant-log-kind { font-weight: 800; color: #ffdf00; font-size: 12px; }
        .grant-log-note { color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .grant-log-amt { font-weight: 800; color: #00ff88; white-space: nowrap; }
        .grant-log-empty { color: #666; padding: 14px 12px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>상류사회 백오피스</h1>
            </div>
            <button class="btn-reset" onclick="resetSystem()">🔄 시스템 초기화</button>
        </div>

        <div class="panel">
            <h3>오버레이 미리보기</h3>
            <div class="preview-wrap">
                <iframe id="previewFrame" title="상류사회 오버레이 미리보기"></iframe>
            </div>
            <p class="preview-caption">OBS에 넣는 화면과 같은 게이지입니다. 자리·cm을 바꾸면 약 0.4초 안에 반영됩니다.</p>
        </div>

        <div class="panel">
            <h3>땅 뺏기 연출</h3>
            <div class="fx-toolbar">
                <button type="button" class="btn-expand" onclick="previewStealFx()">슬라이드 미리보기</button>
            </div>
            <p class="fx-desc-line">기본 슬라이드만 사용합니다. 게이지가 양옆으로 부드럽게 늘어나고 줄어듭니다.</p>
        </div>

        <div class="panel">
            <h3>총 영토</h3>
            <div class="setup-row">
                <label>보드 전체</label>
                <input type="number" id="boardTotalInput" value="400" min="1" step="1" style="width: 140px;" onchange="commitBoardTotal()">
                cm
                <button type="button" class="btn-expand" onclick="splitEqualOnBoard()">전원 1/N 균등</button>
                <button type="button" class="btn-add" onclick="addMember()">+ 멤버 추가</button>
            </div>
            <div class="territory-bar" id="territoryBar"></div>
            <p class="alloc-hint ok" id="boardSumHint">총 400cm를 멤버 수로 나눕니다.</p>
            <div id="liveAllocWrap" style="display:none; margin-top: 12px;">
                <table class="roster-table">
                    <thead>
                        <tr>
                            <th>자리</th>
                            <th>멤버</th>
                            <th>영토 cm</th>
                            <th>비중</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="liveAlloc"></tbody>
                </table>
            </div>
        </div>

        <div id="setupScreen" class="panel">
            <h3>멤버</h3>
            <div class="setup-row">
                <label>방송 계정 u=</label>
                <input type="text" id="userIdInput" value="finalent" style="width: 160px;" autocomplete="off">
                <button type="button" class="btn-expand" onclick="copyOverlayUrl()">OBS 오버레이 URL 복사</button>
                <span id="syncHint" style="color:#888;font-size:13px;"></span>
            </div>
            <div class="setup-row">
                <label>게임 모드:</label>
                <select id="modeSelect" onchange="onModeChange()">
                    <option value="team">팀전 (2~3팀)</option>
                    <option value="individual" selected>개인전 (2~6인)</option>
                </select>
                <span id="rosterCountHint" style="color:#aaa;">4명</span>
                <label>1인당</label>
                <span id="equalHint" style="color:#00ff88;font-size:16px;font-weight:800;">100cm</span>
                <button type="button" class="btn-add" onclick="addMember()">+ 멤버 추가</button>
            </div>
            <table class="roster-table">
                <thead>
                    <tr>
                        <th>자리(왼쪽부터)</th>
                        <th>색</th>
                        <th>이름</th>
                        <th>영토</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="rosterSetup"></tbody>
            </table>
        </div>
        <div id="controlScreen">
            <div class="panel" style="padding: 16px 18px;">
                <h3>오버레이 자리 (왼쪽 → 오른쪽)</h3>
                <div class="seat-bar" id="seatBar"></div>
            </div>
            <div class="controls-grid" id="controls"></div>
            <div class="panel" style="padding: 14px 16px; margin-top: 12px;">
                <h3>영토 기록</h3>
                <div class="grant-log" id="grantLog"></div>
            </div>
        </div>
    </div>
    <script>
        let state = {};
        let persistTimer = null;
        function formatCm(n) {
            const s = (Math.max(0, Number(n) || 0)).toFixed(1);
            return s.endsWith('.0') ? s.slice(0, -2) : s;
        }
        const GRANT_KIND_LABEL = {
            grant: '부여',
            set: '지정',
            steal: '뺏기',
            swap: '교환',
            equal: '균등',
            revive: '부활',
        };
        function formatLogTime(t) {
            const d = new Date(Number(t) || Date.now());
            const p = (n) => String(n).padStart(2, '0');
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }
        function pushGrantLog(kind, id, amount, note) {
            if (!Array.isArray(state.grantLog)) state.grantLog = [];
            const name = state.members?.[id]?.name || id || '';
            state.grantLog.unshift({
                t: Date.now(),
                kind,
                id: String(id || ''),
                name: String(name).slice(0, 40),
                amount: Number(amount) || 0,
                note: String(note || '').slice(0, 80),
            });
            if (state.grantLog.length > 80) state.grantLog.length = 80;
        }
        function renderGrantLog() {
            const box = document.getElementById('grantLog');
            if (!box) return;
            const rows = Array.isArray(state.grantLog) ? state.grantLog : [];
            if (!rows.length) {
                box.innerHTML = '<div class="grant-log-empty">아직 부여 기록이 없습니다.</div>';
                return;
            }
            box.innerHTML = rows.map((row) => {
                const kind = GRANT_KIND_LABEL[row.kind] || row.kind || '기록';
                const amt = Number(row.amount);
                const sign = amt < 0 ? '-' : (row.kind === 'grant' && amt > 0 ? '+' : '');
                const amtText = Number.isFinite(amt) && amt !== 0
                    ? `${sign}${formatCm(Math.abs(amt))}cm`
                    : '';
                return `<div class="grant-log-row">
                    <span class="grant-log-time">${formatLogTime(row.t)}</span>
                    <span class="grant-log-kind">${escapeHtml(kind)}</span>
                    <span class="grant-log-note">${escapeHtml(row.note || row.name || '')}</span>
                    <span class="grant-log-amt">${escapeHtml(amtText)}</span>
                </div>`;
            }).join('');
        }
        function readUserId() {
            const fromUrl = new URLSearchParams(location.search).get('u')
                || new URLSearchParams(location.search).get('user')
                || '';
            const typed = (document.getElementById('userIdInput')?.value || '').trim();
            const id = typed || fromUrl || 'finalent';
            return /^[a-zA-Z0-9_-]{1,64}$/.test(id) ? id : 'finalent';
        }
        function apiUrl() {
            return `/api/shangliu?u=${encodeURIComponent(readUserId())}`;
        }
        function overlayUrl() {
            return `${location.origin}/overlay.html?u=${encodeURIComponent(readUserId())}`;
        }
        function previewUrl() {
            return `/overlay.html?u=${encodeURIComponent(readUserId())}&preview=1&_t=${Date.now()}`;
        }
        function refreshPreview() {
            const frame = document.getElementById('previewFrame');
            if (!frame) return;
            frame.onload = () => pushPreviewState();
            frame.src = previewUrl();
        }
        function currentOverlayState() {
            ensureLiveState();
            if (!state.members || Object.keys(state.members).length < 2) return null;
            return state;
        }
        function pushPreviewState() {
            const frame = document.getElementById('previewFrame');
            const snap = currentOverlayState();
            if (!frame || !snap || !frame.contentWindow) {
                window.setTimeout(() => {
                    const f = document.getElementById('previewFrame');
                    const s = currentOverlayState();
                    if (!f || !s || !f.contentWindow) return;
                    try { f.contentWindow.postMessage({ type: 'shangliu-state', state: s }, location.origin); } catch (_e) {}
                }, 400);
                return;
            }
            try {
                frame.contentWindow.postMessage({ type: 'shangliu-state', state: snap }, location.origin);
            } catch (_e) {}
        }
        function pingPreviewFx(fxId) {
            const frame = document.getElementById('previewFrame');
            if (!frame) return;
            const payload = {
                type: 'shangliu-play-fx',
                fxId: 'slide',
                gainers: (state.activeOrder || Object.keys(state.members || {}))[0]
                    ? [(state.activeOrder || Object.keys(state.members || {}))[0]] : [],
                losers: (state.activeOrder || Object.keys(state.members || {}))[1]
                    ? [(state.activeOrder || Object.keys(state.members || {}))[1]] : [],
            };
            const send = () => {
                try {
                    const ready = (frame.contentDocument?.querySelectorAll('.territory') || []).length >= 2;
                    if (!ready || !frame.contentWindow) return false;
                    frame.contentWindow.postMessage(payload, location.origin);
                    return true;
                } catch (_e) {
                    return false;
                }
            };
            if (!send()) window.setTimeout(send, 400);
        }
        function copyOverlayUrl() {
            const url = overlayUrl();
            navigator.clipboard.writeText(url).then(() => {
                document.getElementById('syncHint').textContent = '복사됨: ' + url;
            }).catch(() => {
                prompt('OBS 브라우저 소스에 이 주소를 넣으세요', url);
            });
        }
        function setSyncHint(text, ok) {
            const el = document.getElementById('syncHint');
            if (!el) return;
            el.textContent = text;
            el.style.color = ok === false ? '#ff6688' : ok ? '#00ff88' : '#888';
        }
        const defaultColors = ['#ff007f', '#00f3ff', '#ffdf00', '#b700ff', '#00ff88', '#ff6b00'];
        const defaultNames = ['박자키', '갓정은', '왓컴퍼니', '꽃돼지', '멤버5', '멤버6'];
        function maxRosterSize() {
            return state && state.mode === 'team' ? 3 : 6;
        }
        function nextFreeId(used) {
            const taken = new Set((used || []).map((id) => String(id)));
            for (let i = 0; i < 26; i += 1) {
                const id = String.fromCharCode(65 + i);
                if (!taken.has(id)) return id;
            }
            return null;
        }
        function uniqueMemberIds() {
            return Object.keys(state.members || {}).filter((id) => /^[A-Z]$/.test(id));
        }
        function seatIds() {
            const members = state.members || {};
            const seen = new Set();
            const order = [];
            (Array.isArray(state.activeOrder) ? state.activeOrder : []).forEach((id) => {
                if (!members[id] || seen.has(id)) return;
                if ((Number(members[id].cm) || 0) <= 0) return;
                seen.add(id);
                order.push(id);
            });
            return order;
        }
        function rosterCount() {
            return uniqueMemberIds().length;
        }
        function ensureLiveState() {
            const modeEl = document.getElementById('modeSelect');
            if (!state || typeof state !== 'object') state = {};
            if (!Array.isArray(state.activeOrder)) state.activeOrder = [];
            if (!state.members || typeof state.members !== 'object') state.members = {};
            let ids = uniqueMemberIds();
            if (ids.length < 2) {
                const mode = modeEl?.value === 'team' ? 'team' : 'individual';
                const total = boardTotal();
                const seed = 4;
                state.members = {};
                state.activeOrder = [];
                for (let i = 0; i < seed; i += 1) {
                    const id = String.fromCharCode(65 + i);
                    state.activeOrder.push(id);
                    state.members[id] = {
                        name: mode === 'team' ? `팀 ${id}` : defaultNames[i],
                        color: defaultColors[i],
                        cm: 0,
                    };
                }
                state.boardTotalCm = total;
                state.mode = mode;
                applyEqualToState();
                ids = uniqueMemberIds();
            }
            if (state.mode !== 'team') state.mode = 'individual';
            state.stealFx = 'slide';
            state.stealSeq = Number(state.stealSeq) || 0;
            if (state.stealDemo !== true) state.stealDemo = false;
            if (!Array.isArray(state.grantLog)) state.grantLog = [];
            state.boardTotalCm = boardTotal();
            state.activeOrder = seatIds();
            const totalInput = document.getElementById('boardTotalInput');
            if (totalInput) totalInput.value = String(state.boardTotalCm || 400);
            if (modeEl) modeEl.value = state.mode;
        }
        function clampBoardTotal(n) {
            const v = Number(n);
            if (!Number.isFinite(v) || v <= 0) return 400;
            return Math.max(1, Math.min(1_000_000, v));
        }
        function boardTotal() {
            return clampBoardTotal(state.boardTotalCm || document.getElementById('boardTotalInput')?.value);
        }
        function occupiedFromState() {
            return Object.values(state.members || {}).reduce((sum, m) => sum + Math.max(0, Number(m.cm) || 0), 0);
        }
        function toTenths(n) {
            const v = Number(n);
            if (!Number.isFinite(v)) return 0;
            return Math.round(v * 10);
        }
        function fromTenths(t) {
            return Math.round(Number(t) || 0) / 10;
        }
        function setMemberCmVal(id, cm) {
            if (!state.members || !state.members[id]) return;
            state.members[id].cm = fromTenths(Math.max(0, toTenths(cm)));
        }
        function snapRosterCm() {
            Object.keys(state.members || {}).forEach((id) => setMemberCmVal(id, state.members[id].cm));
        }
        function splitTenths(ids, remainT, weights) {
            const n = ids.length;
            if (!n) return [];
            const need = Math.max(0, Math.round(Number(remainT) || 0));
            if (need <= 0) return ids.map(() => 0);
            let w = (weights || []).map((x) => Math.max(0, Math.round(Number(x) || 0)));
            let wsum = w.reduce((a, b) => a + b, 0);
            if (wsum <= 0) w = ids.map(() => 1);
            wsum = w.reduce((a, b) => a + b, 0);
            const raw = w.map((x) => (need * x) / wsum);
            const floors = raw.map((v) => Math.floor(v + 1e-9));
            let leftover = need - floors.reduce((a, b) => a + b, 0);
            const order = raw
                .map((v, i) => ({ i, frac: v - Math.floor(v + 1e-9) }))
                .sort((a, b) => b.frac - a.frac);
            const extra = new Array(n).fill(0);
            for (let k = 0; k < leftover; k += 1) extra[order[k % n].i] += 1;
            return floors.map((f, i) => f + extra[i]);
        }
        function isSeated(id) {
            return (state.activeOrder || []).includes(id);
        }
        function takeTenthsFromOthers(exceptId, needT) {
            let left = Math.max(0, needT);
            const ids = (state.activeOrder || []).filter((id) => id !== exceptId && state.members[id]);
            let guard = 0;
            while (left > 0 && guard < 20) {
                guard += 1;

                const plan = splitTenths(holders, Math.min(left, have), weights);

                    const haveT = toTenths(state.members[id].cm);

            if (!ids.length) return 0;

            const targets = seated.length ? seated : ids;
            const weights = targets.map((id) => toTenths(state.members[id].cm));
            const plan = splitTenths(targets, left, weights);
            plan.forEach((t, i) => {

                    if (step > 0 && t >= totalT) return false;

                        </div>
                        <div class="action-group">
                            <input type="number" id="setcm-${id}" placeholder="지정 cm" min="0">
                            <button class="btn-set" onclick="setMemberCm('${id}')">지정</button>
                        </div>
                        <div class="action-group">
                            <input type="number" id="input-${id}" placeholder="뺏을 cm">
                            <button class="btn-expand" onclick="expandTerritory('${id}')">뺏기</button>
                        </div>
                        <div class="rule-text">${rule}</div>
                    </div>`;
                } else {
                    const canEnter = (Number(m.cm) || 0) > 0;
                    html = `
                    <div class="card offboard" data-member="${id}">
                        <div class="card-header">
                            <div class="card-cm" style="color:#ccc;">${formatCm(m.cm)} <span>cm</span></div>
                            <div class="seat-badge" style="color:#aaa;border-color:#555;background:#111;">대기</div>
                        </div>
                        <div class="identity-row">
                            <input type="color" value="${escapeHtml(m.color)}" title="땅 색" oninput="patchMember('${id}','color',this.value)">
                            <input type="text" maxlength="40" data-member-name="${id}" value="${escapeHtml(m.name)}" placeholder="이름" oninput="patchMember('${id}','name',this.value)">
                        </div>
                        <div class="action-group">
                            <input type="number" id="grant-${id}" placeholder="+/- cm">
                            <button class="btn-grant" onclick="grantMemberCm('${id}')">부여</button>
                        </div>
                        <div class="action-group">
                            <input type="number" id="revive-${id}" placeholder="추가 뺏기 cm" min="0" ${canEnter ? '' : 'disabled'}>
                            <button class="btn-revive" ${canEnter ? '' : 'disabled'} onclick="reviveMember('${id}', 'left')">좌측 벽</button>
                            <button class="btn-revive" ${canEnter ? '' : 'disabled'} onclick="reviveMember('${id}', 'right')">우측 벽</button>
                        </div>
                        <div class="rule-text">${canEnter ? '고른 쪽 끝의 땅에서 부여한 cm를 가져옵니다. 그 끝이 0cm가 되면 탈락합니다.' : '영토를 부여한 뒤 왼쪽·오른쪽 벽을 고르세요.'}</div>
                    </div>`;
                }
                controls.innerHTML += html;
            });
            renderLiveAlloc();
            renderGrantLog();
        }
        ensureLiveState();
        renderRosterSetup();
        renderControls();
        (function boot() {
            const params = new URLSearchParams(location.search);
            const u = params.get('u') || params.get('user') || 'finalent';
            const input = document.getElementById('userIdInput');
            if (input) input.value = u;
            refreshPreview();
            fetch(apiUrl(), { credentials: 'include', cache: 'no-store' })
                .then((r) => r.json())
                .then((j) => {
                    const fromServer = Boolean(j && j.ok && j.state && j.state.members && Object.keys(j.state.members).length >= 2);
                    if (fromServer) {
                        state = j.state;
                    }
                    ensureLiveState();
                    const totalInput = document.getElementById('boardTotalInput');
                    if (totalInput) totalInput.value = String(state.boardTotalCm || occupiedFromState() || 400);
                    renderRosterSetup();
                    renderControls();
                    pushPreviewState();
                    if (!fromServer) saveState();
                })
                .catch(() => {
                    ensureLiveState();
                    renderRosterSetup();
                    renderControls();
                    pushPreviewState();
                });
        })();
    </script>
</body>
</html>
